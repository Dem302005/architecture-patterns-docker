services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-orders}
      POSTGRES_USER: ${DB_USER:-orders}
      POSTGRES_PASSWORD: ${DB_PASS:-orders}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    environment:
      PORT: ${PORT:-8081}
      REPO_ADAPTER: ${REPO_ADAPTER:-db}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-orders}
      DB_USER: ${DB_USER:-orders}
      DB_PASS: ${DB_PASS:-orders}
      CSV_PATH: /data/orders.csv
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    volumes:
      - csvdata:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:%s/health' % os.getenv('PORT','8081'),timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  pgdata:
  csvdata:
