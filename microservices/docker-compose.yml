x-service: &service
  restart: on-failure
  networks:
    - ms-net
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=2)"]
    interval: 10s
    timeout: 3s
    start_period: 5s
    retries: 5

services:
  catalog:
    <<: *service
    build: ./services/catalog

  users:
    <<: *service
    build: ./services/users

  orders:
    <<: *service
    build: ./services/orders

  gateway:
    image: nginx:1.27-alpine
    restart: on-failure
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ms-net
    depends_on:
      catalog:
        condition: service_healthy
      users:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  ms-net:
    name: ms-net
