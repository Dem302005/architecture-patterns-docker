openapi: 3.0.3
info:
  title: Catalog service
  version: 1.0.0
paths:
  /items:
    get:
      summary: List catalog items
      responses:
        "200":
          description: Array of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
components:
  schemas:
    Item:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Desk
