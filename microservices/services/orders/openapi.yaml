openapi: 3.0.3
info:
  title: Orders service
  version: 1.0.0
paths:
  /orders:
    post:
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        "400":
          description: Invalid payload
  /orders/{id}:
    get:
      summary: Get order by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order found
        "404":
          description: Order not found
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
components:
  schemas:
    NewOrder:
      type: object
      required: [userId, itemId, qty]
      properties:
        userId:
          type: integer
          minimum: 1
        itemId:
          type: integer
          minimum: 1
        qty:
          type: integer
          minimum: 1
