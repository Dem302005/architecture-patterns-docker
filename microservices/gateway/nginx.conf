worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream catalog_up {
        server catalog:5000;
    }

    upstream users_up {
        server users:5000;
    }

    upstream orders_up {
        server orders:5000;
    }

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    server {
        listen 80;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location /catalog/ {
            proxy_pass http://catalog_up/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/users/(\d+)$ {
            proxy_pass http://users_up/users/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /users/ {
            proxy_pass http://users_up/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /orders {
            proxy_pass http://orders_up/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/orders/(\d+)$ {
            proxy_pass http://orders_up/orders/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /orders/ {
            proxy_pass http://orders_up/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
